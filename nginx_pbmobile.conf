# Nginx Reverse Proxy Configuration for Point Blank Mobile
# Place in /etc/nginx/sites-available/pbmobile and link to sites-enabled

server {
    listen 80;
    server_name _; # Or replace with your domain name e.g. pb.yourdomain.com

    # Increase maximum body size for asset uploads
    client_max_body_size 64M;

    # Static Assets Caching
    location /a/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # WebSocket Routes (/ws for Lobby, /b* for Real-time Battle)
    location ~* ^/(ws|b.*)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Main HTTP Game Client & API
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
